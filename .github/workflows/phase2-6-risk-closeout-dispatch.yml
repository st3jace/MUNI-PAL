name: Phase 2-6 Risk Closeout Bundle

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note for this closeout run"
        required: false
        type: string

jobs:
  risk-closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          npm ci --prefix frontend

      - name: Run Phase 2-6 risk closeout bundle
        env:
          USE_SQLITE: "true"
        run: |
          python scripts/run_phase2_6_risk_closeout_bundle.py

      - name: Capture latest summary path
        if: always()
        id: bundle_paths
        run: |
          latest_md="$(ls -t reports/phase2_6_closeout/phase2_6_closeout_*.md | head -1)"
          latest_json="$(ls -t reports/phase2_6_closeout/phase2_6_closeout_*.json | head -1)"
          echo "latest_md=${latest_md}" >> "$GITHUB_OUTPUT"
          echo "latest_json=${latest_json}" >> "$GITHUB_OUTPUT"

      - name: Upload bundle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-6-risk-closeout-${{ github.run_id }}
          path: |
            reports/phase2_6_closeout/phase2_6_closeout_*.md
            reports/phase2_6_closeout/phase2_6_closeout_*.json
            reports/phase2_6_closeout/openapi_generated_artifacts_*.md
            reports/phase2_6_closeout/openapi_generated_artifacts_*.json
            reports/phase2_6_closeout/test_suite_health_*.md
            reports/phase2_6_closeout/test_suite_health_*.json
            reports/phase2_6_closeout/logs_*/
          retention-days: 14

      - name: Append workflow summary
        if: always()
        env:
          RUN_NOTE: ${{ inputs.note }}
        run: |
          {
            echo "## Phase 2-6 Risk Closeout Bundle"
            echo ""
            echo "- Workflow run: \`${GITHUB_RUN_ID}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            if [ -n "${RUN_NOTE}" ]; then
              echo "- Note: ${RUN_NOTE}"
            fi
            echo "- Latest markdown report: \`${{ steps.bundle_paths.outputs.latest_md }}\`"
            echo "- Latest JSON report: \`${{ steps.bundle_paths.outputs.latest_json }}\`"
            echo "- Artifact: \`phase2-6-risk-closeout-${GITHUB_RUN_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"
