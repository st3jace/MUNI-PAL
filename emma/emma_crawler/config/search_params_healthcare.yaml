# ── Healthcare Sector — Broad Pass ──────────────────────────────
# Uses EMMA's "Health" purpose/sector dropdown to capture the full
# universe of healthcare-related municipal securities.
#
# Run with:
#   python -m src.main --config ./config/healthcare --visible
#
# After the broad pass, run targeted keyword passes to catch
# securities mislabeled under other sectors (see keyword configs
# in config/healthcare/keywords/).

search_filters:
  security_information:
    state: ""
    issuer_name: ""
    issue_description: ""              # Blank — rely on purpose_sector
    closing_date_from: "1/1/2020"
    closing_date_to: "TODAY"
    purpose_sector: "Health"           # EMMA's Health category
    source_of_repayment: "Revenue"     # Hospital revenue bonds
    rate_type: "All"
    insured: "All"
    tax_status: "Tax-Exempt"
    callable: "All"
  dated_date_from: ""
  dated_date_to: ""
  interest_rate_from: ""
  interest_rate_to: ""
  cusip6: ""
  maturity_date_from: ""
  maturity_date_to: ""
  include_matured: false
  include_called_redeemed: false
result_filters:
  min_principal_amount: 30000000
view_mode: "SECURITIES"
