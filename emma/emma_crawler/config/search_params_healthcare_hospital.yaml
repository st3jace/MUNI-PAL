# ── Healthcare Sector — Targeted Keyword Passes ─────────────────
# These keyword-specific searches catch healthcare securities that
# may be classified under other EMMA sectors.
#
# Run each pass separately by copying the desired keyword block
# into issue_description, or use the crawl runner script.
#
# PASS 1: Hospital (broad)
# PASS 2: Continuing Care / CCRC
# PASS 3: Senior Living / Assisted Living
# PASS 4: Behavioral Health
# PASS 5: Medical
# PASS 6: Clinic
#
# After all passes, deduplicate results by EMMA URL hash.
# ─────────────────────────────────────────────────────────────────

# ── PASS 1: Hospital ──
search_filters:
  security_information:
    state: ""
    issuer_name: ""
    issue_description: "Hospital"
    closing_date_from: "1/1/2020"
    closing_date_to: "TODAY"
    purpose_sector: "All"              # All sectors — catch mislabeled
    source_of_repayment: "Revenue"
    rate_type: "All"
    insured: "All"
    tax_status: "Tax-Exempt"
    callable: "All"
  dated_date_from: ""
  dated_date_to: ""
  interest_rate_from: ""
  interest_rate_to: ""
  cusip6: ""
  maturity_date_from: ""
  maturity_date_to: ""
  include_matured: false
  include_called_redeemed: false
result_filters:
  min_principal_amount: 30000000
view_mode: "SECURITIES"
