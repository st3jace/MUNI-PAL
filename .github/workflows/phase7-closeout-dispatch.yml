name: Phase 7 Closeout Bundle

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note for this closeout run"
        required: false
        type: string

jobs:
  closeout-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          npm ci --prefix frontend

      - name: Run Phase 7 closeout bundle
        env:
          USE_SQLITE: "true"
        run: |
          python scripts/run_phase7_closeout_bundle.py

      - name: Capture latest closeout summary path
        if: always()
        id: closeout_paths
        run: |
          latest_md="$(ls -t reports/phase7_closeout/phase7_closeout_*.md | head -1)"
          latest_json="$(ls -t reports/phase7_closeout/phase7_closeout_*.json | head -1)"
          echo "latest_md=${latest_md}" >> "$GITHUB_OUTPUT"
          echo "latest_json=${latest_json}" >> "$GITHUB_OUTPUT"

      - name: Upload closeout artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-closeout-${{ github.run_id }}
          path: |
            reports/phase7_closeout/phase7_closeout_*.md
            reports/phase7_closeout/phase7_closeout_*.json
            reports/phase7_closeout/logs_*/
            reports/phase7_closeout/STAGING_EVIDENCE_TEMPLATE.md
          retention-days: 14

      - name: Append workflow summary
        if: always()
        env:
          CLOSEOUT_NOTE: ${{ inputs.note }}
        run: |
          {
            echo "## Phase 7 Closeout Bundle"
            echo ""
            echo "- Workflow run: \`${GITHUB_RUN_ID}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            if [ -n "${CLOSEOUT_NOTE}" ]; then
              echo "- Note: ${CLOSEOUT_NOTE}"
            fi
            echo "- Latest markdown report: \`${{ steps.closeout_paths.outputs.latest_md }}\`"
            echo "- Latest JSON report: \`${{ steps.closeout_paths.outputs.latest_json }}\`"
            echo "- Artifact: \`phase7-closeout-${GITHUB_RUN_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"
