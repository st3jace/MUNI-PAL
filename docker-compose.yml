version: "3.9"

services:
  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: munipal-postgres
    environment:
      POSTGRES_USER: munipal
      POSTGRES_PASSWORD: munipal_dev_password
      POSTGRES_DB: munipal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U munipal -d munipal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Redis (Local Development - mirrors Redis Cloud structure)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: munipal-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # FastAPI Application
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: munipal-api
    environment:
      - APP_ENV=development
      - DEBUG=true
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=munipal
      - POSTGRES_PASSWORD=munipal_dev_password
      - POSTGRES_DB=munipal
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn munipal.main:app --host 0.0.0.0 --port 8000 --reload

  # ==========================================================================
  # Celery Worker
  # ==========================================================================
  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: munipal-celery-worker
    environment:
      - APP_ENV=development
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=munipal
      - POSTGRES_PASSWORD=munipal_dev_password
      - POSTGRES_DB=munipal
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./src:/app/src
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A munipal.workers.celery_app worker --loglevel=info

  # ==========================================================================
  # Celery Beat (Scheduler) - Optional for periodic tasks
  # ==========================================================================
  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: munipal-celery-beat
    environment:
      - APP_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./src:/app/src
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A munipal.workers.celery_app beat --loglevel=info

volumes:
  postgres_data:
  redis_data:
