# =============================================================================
# Nginx Reverse Proxy — Muni-Pal Sensing Microservice
# assess.launchshop.io
#
# Security model:
#   - ONLY /api/v1/sensing/* and /health routes proxied to sensing API
#   - ALL other routes return 404
#   - Rate limiting enforced at both Nginx and application layers
#   - TLS termination via Certbot / Cloudflare (see deployment notes)
# =============================================================================

# Rate limiting zones — outer layer (Nginx), inner layer handled by slowapi
limit_req_zone $binary_remote_addr zone=sensing_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=sensing_lead:10m rate=10r/m;

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name assess.launchshop.io;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — main sensing service
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name assess.launchshop.io;

    # TLS — managed by Certbot or Cloudflare Origin Certificate
    ssl_certificate     /etc/letsencrypt/live/assess.launchshop.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assess.launchshop.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://assess.launchshop.io;" always;

    # ---------------------------------------------------------------------------
    # Health check (no rate limit — used by load balancer)
    # ---------------------------------------------------------------------------
    location = /health {
        proxy_pass         http://sensing_api;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ---------------------------------------------------------------------------
    # Lead capture — tighter rate limit (10/min)
    # ---------------------------------------------------------------------------
    location = /api/v1/sensing/lead {
        limit_req zone=sensing_lead burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://sensing_api;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    # ---------------------------------------------------------------------------
    # Sensing API — /api/v1/sensing/* only
    # ---------------------------------------------------------------------------
    location /api/v1/sensing/ {
        limit_req zone=sensing_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://sensing_api;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 512k;
    }

    # ---------------------------------------------------------------------------
    # Frontend static files (served from /app/dist if built into container)
    # ---------------------------------------------------------------------------
    location / {
        root   /app/dist;
        index  index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ---------------------------------------------------------------------------
    # Block ALL other API routes — BFMS, admin, projects must not be reachable
    # ---------------------------------------------------------------------------
    location /api/ {
        return 404 '{"detail": "Not found"}';
        add_header Content-Type application/json;
    }

    # Docs only in debug mode (not served in production)
    location ~ ^/(docs|redoc|openapi.json) {
        return 404;
    }

    # Default deny for anything unmatched
    location ~ ^/.+ {
        return 404;
    }
}

# ---------------------------------------------------------------------------
# Upstream — sensing API container
# ---------------------------------------------------------------------------
upstream sensing_api {
    server sensing-api:8000;
    keepalive 32;
}
