# =============================================================================
# Nginx Reverse Proxy — Muni-Pal Production
# muni-pal.io
#
# Replaces assess.launchshop.io for the public sensing microservice.
# Also serves the healthcare landing page and future BFMS routes.
#
# Security model:
#   - /api/v1/sensing/* and /health proxied to sensing API
#   - /api/* (BFMS) proxied to main backend (when enabled)
#   - Rate limiting at Nginx layer; application layer (slowapi) is secondary
#   - TLS termination via Cloudflare (Full Strict) or Certbot fallback
# =============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=sensing_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=sensing_lead:10m rate=10r/m;

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name muni-pal.io www.muni-pal.io;

    # Certbot ACME challenge (fallback if not using Cloudflare)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://muni-pal.io$request_uri;
    }
}

# ---------------------------------------------------------------------------
# www → apex redirect
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name www.muni-pal.io;

    ssl_certificate     /etc/letsencrypt/live/muni-pal.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muni-pal.io/privkey.pem;

    return 301 https://muni-pal.io$request_uri;
}

# ---------------------------------------------------------------------------
# HTTPS — muni-pal.io main service
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name muni-pal.io;

    # TLS — Cloudflare Origin Certificate or Certbot
    ssl_certificate     /etc/letsencrypt/live/muni-pal.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muni-pal.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://muni-pal.io https://api.muni-pal.io;" always;

    # ---------------------------------------------------------------------------
    # Health check (no rate limit — used by load balancer / uptime monitor)
    # ---------------------------------------------------------------------------
    location = /health {
        proxy_pass         http://sensing_api;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ---------------------------------------------------------------------------
    # Lead capture — tighter rate limit (10/min)
    # ---------------------------------------------------------------------------
    location = /api/v1/sensing/lead {
        limit_req zone=sensing_lead burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://sensing_api;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    # ---------------------------------------------------------------------------
    # Sensing API — /api/v1/sensing/* only
    # ---------------------------------------------------------------------------
    location /api/v1/sensing/ {
        limit_req zone=sensing_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://sensing_api;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 512k;
    }

    # ---------------------------------------------------------------------------
    # Frontend — static files from sensing build
    # ---------------------------------------------------------------------------
    location / {
        root   /app/dist;
        index  index.sensing.html index.html;
        try_files $uri $uri/ /index.sensing.html;

        # Cache static assets aggressively (hashed filenames)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ---------------------------------------------------------------------------
    # Block internal-only API routes
    # ---------------------------------------------------------------------------
    location /api/ {
        return 404 '{"detail": "Not found"}';
        add_header Content-Type application/json;
    }

    # Block docs in production
    location ~ ^/(docs|redoc|openapi.json) {
        return 404;
    }
}

# ---------------------------------------------------------------------------
# Upstream — sensing API container
# ---------------------------------------------------------------------------
upstream sensing_api {
    server sensing-api:8000;
    keepalive 32;
}
